<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=Press+Start+2P&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <title>Login</title>
</head>

<body class="authPage">

<div class="authWrapper">
    <h1 class="appTitle">MyGameCollection</h1>
    <div id="loginFormContainer" class="cardModal">
        <form id="loginForm">
            <label for="username">Username</label>
            <input type="text" id="username" placeholder="Enter Username">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="Enter Password">
            <button type="submit" id="loginbtn">Log In</button>
        </form>
        <p class="signup-prompt">Not got an account yet? <span id="openRegisterbtn">SIGN UP</span></p>
    </div>
</div>


<dialog id="registerDialog" class="cardModal">
    <button type="button" id="cancelRegisterbtn">&times;</button>
    <form id="registerForm">
        <label for="usernameNew">Username</label>
        <input type="text" id="usernameNew" placeholder="Enter Username">
        <label for="passwordNew">Password</label>
        <input type="password" id="passwordNew" placeholder="Enter Password">
        <label for="passwordNewConfirm">Confirm Password</label>
        <input type="password" id="passwordNewConfirm" placeholder="Re-enter password">
        <button type="submit" id="registerbtn">Sign Up</button>
    </form>
</dialog>

<script src="js/auth.js"></script>
</body>
</html>
